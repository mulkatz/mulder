# Mulder — Example Configuration
# Copy to mulder.config.yaml and customize for your domain.
# Only configure what you deviate from — sensible defaults are applied for everything else.

# --- Project ---
project:
  name: "my-document-collection"
  description: "Domain-specific document intelligence"
  supported_locales: ["en"]          # UI + prompt language (entity resolution works across ALL languages)

# --- API ---
api:
  port: 8080
  auth:
    api_keys:
      - name: "cli"
        key: "${MULDER_API_KEY}"      # Bearer token accepted by protected routes
    browser:
      enabled: true
      cookie_name: "mulder_session"
      session_secret: "${MULDER_SESSION_SECRET}"
      session_ttl_hours: 168
      invitation_ttl_hours: 168
      cookie_secure: false            # Set true behind HTTPS in production
      same_site: "Lax"                # Use "None" for the Cloudflare frontend + api subdomain production split
  # Production browser deployment also uses environment variables:
  # MULDER_CORS_ORIGINS=https://app.example.com
  # MULDER_APP_BASE_URL=https://app.example.com
  # MULDER_INVITE_DELIVERY=resend
  # MULDER_MAIL_FROM=<verified sender>
  # RESEND_API_KEY=<mounted secret>
  rate_limiting:
    enabled: true                     # In-memory token buckets per Cloud Run instance
  budget:
    enabled: true
    monthly_limit_usd: 50             # Hard gate for accepted API work in the current month
    extract_per_page_usd: 0.0060      # Conservative reservation model, not invoice-grade billing
    segment_per_page_usd: 0.0020
    enrich_per_source_usd: 0.0150
    embed_per_source_usd: 0.0040
    graph_per_source_usd: 0.0010

# --- GCP ---
gcp:
  project_id: "my-gcp-project"
  region: "europe-west1"
  cloud_sql:
    instance_name: "mulder-db"
    database: "mulder"
    tier: "db-custom-2-8192"         # 2 vCPU, 8GB RAM — sufficient for ~100k vectors
  storage:
    bucket: "mulder-my-project"
  document_ai:
    processor_id: "abc123def456"     # Document AI Layout Parser processor ID
    location: "eu"                   # Document AI multi-region: "eu" or "us" (separate from gcp.region)

# --- Dev Mode ---
# Set to true for local development with fixtures — no GCP calls, no cost.
dev_mode: false

# --- Domain Ontology ---
# Define entity types and relationships for your domain.
# Gemini structured output uses dynamically generated JSON Schema from this config.
ontology:
  entity_types:
    - name: "person"
      description: "A named individual"
      attributes:
        - name: "role"
          type: "string"
        - name: "affiliation"
          type: "string"
    - name: "location"
      description: "A geographic location"
      attributes:
        - name: "coordinates"
          type: "geo_point"
        - name: "region"
          type: "string"
    - name: "organization"
      description: "A named organization or institution"
      attributes:
        - name: "type"
          type: "string"
    - name: "event"
      description: "A specific occurrence or incident"
      attributes:
        - name: "date"
          type: "date"
        - name: "location"
          type: "string"
    - name: "document"
      description: "A referenced publication or report"
      attributes:
        - name: "author"
          type: "string"
        - name: "publication_date"
          type: "date"

  relationships:
    - name: "PARTICIPATED_IN"
      source: "person"
      target: "event"
    - name: "LOCATED_IN"
      source: "event"
      target: "location"
    - name: "AFFILIATED_WITH"
      source: "person"
      target: "organization"
    - name: "AUTHORED"
      source: "person"
      target: "document"
    - name: "REFERENCES"
      source: "document"
      target: "event"

# --- Ingestion ---
ingestion:
  max_file_size_mb: 100              # Reject PDFs larger than this
  max_pages: 2000                    # Reject PDFs with more pages

# --- Ingest Provenance ---
ingest_provenance:
  required_metadata:
    channel: true
    submitted_by: true
    collection_id: false
    original_source: false
    custody_chain: false
  archives:
    auto_register: true
  collections:
    auto_create_from_archive: true
    auto_tag_from_path_segments: true
    default_collection: null
    default_sensitivity_level: "internal"
    default_language: "und"
    default_credibility_profile_id: null

# --- Extraction ---
extraction:
  native_text_threshold: 0.9         # Skip Document AI if >= 90% pages have native text
  max_vision_pages: 20               # Circuit breaker: max pages sent to Gemini Vision fallback
  segmentation:
    model: "gemini-2.5-flash"

# --- Document Quality ---
document_quality:
  enabled: true
  assessment:
    method: "ocr_confidence"          # Local/default: no external calls
    engine: null
    ocr_confidence_threshold: 0.7
    native_text_ratio_threshold: 0.5
  routing:
    high: { path: "standard" }
    medium: { path: "enhanced_ocr", fallback: "visual_extraction" }
    low: { path: "visual_extraction", fallback: "manual_transcription_required" }
    unusable: { path: "skip", create_manual_task: false }
  quality_propagation:
    enabled: true
    low_quality_embedding_weight: 0.5
    low_quality_assertion_penalty: 0.3
  manual_queue:
    enabled: false
    notify_reviewers: false
    priority: "normal"

# --- Access Control ---
access_control:
  enabled: true
  sensitivity:
    levels: ["public", "internal", "restricted", "confidential"]
    default_level: "internal"
    auto_detection: true
    propagation: "upward"
    pii_types:
      - "person_name"
      - "contact_info"
      - "medical_data"
      - "location_private"
      - "location_sighting"
      - "financial"
      - "unpublished_research"
      - "legal"
  rbac:
    roles_source: "config/roles.yaml" # Metadata only; defaults below are self-contained
    default_role: "analyst"
    roles:
      - id: "analyst"
        name: "Analyst"
        max_sensitivity_level: "internal"
        permissions: ["read"]
      - id: "reviewer"
        name: "Reviewer"
        max_sensitivity_level: "restricted"
        permissions: ["read", "review", "classify"]
      - id: "admin"
        name: "Administrator"
        max_sensitivity_level: "confidential"
        permissions: ["read", "write", "review", "classify", "delete", "admin", "export", "agent_config"]
  external_query_gate:
    enabled: false

# --- Review Workflow ---
review_workflow:
  enabled: true
  metrics:
    track_accuracy: true
    auto_adjust_depth: false           # Reserved until a review-depth policy worker exists
    accuracy_threshold_for_upgrade: 0.7
    accuracy_threshold_for_downgrade: 0.95

# --- Enrichment ---
enrichment:
  model: "gemini-2.5-flash"
  max_story_tokens: 15000            # Pre-chunk fallback if story exceeds this

# --- Taxonomy ---
taxonomy:
  normalization_threshold: 0.4
  harmonization:
    enabled: true
    taxonomies: []                   # Add configured taxonomy refs: { id, source, version, language, status }
    auto_mapping:
      enabled: false                 # Storage/review boundary only; no automatic LLM generation by default
      engine: "gemini-2.5-pro"
      require_human_review: true
      min_confidence_for_auto_link: 0.70
    extraction:
      detect_classification_refs: true
      detect_implicit_classifications: true

# --- Entity Resolution ---
entity_resolution:
  strategies:
    - type: "attribute_match"         # Deterministic: coordinates, dates, IDs
      enabled: true
    - type: "embedding_similarity"    # Statistical: text-embedding-004
      enabled: true
      threshold: 0.85
    - type: "llm_assisted"            # Semantic: Gemini decides
      enabled: true
      model: "gemini-2.5-flash"
  cross_lingual: true                 # Always true — cross-lingual is the default

# --- Deduplication ---
deduplication:
  enabled: true
  segment_level:
    strategy: "minhash"               # minhash | embedding_similarity
    similarity_threshold: 0.90        # Above this = near-duplicate
  corroboration_filter:
    same_author_is_one_source: true
    similarity_above_threshold_is_one_source: true

# --- Graph Step ---
graph:
  # When true, stories with no explicit enrich relationships get an O(n²)
  # co_occurs_with edge between every entity pair. A 50-entity story
  # produces 1225 edges; a 100-entity story 4950. Disabled by default —
  # enable only if a downstream consumer needs co-occurrence fallback.
  cooccurrence_fallback: false

# --- Embedding ---
embedding:
  model: "text-embedding-004"
  storage_dimensions: 768             # Matryoshka: 768-dim via outputDimensionality API param
  chunk_size_tokens: 512
  chunk_overlap_tokens: 50
  questions_per_chunk: 3              # Generated questions for improved retrieval

# --- Retrieval ---
retrieval:
  default_strategy: "hybrid"          # vector | fulltext | graph | hybrid
  top_k: 10
  rerank:
    enabled: true
    model: "gemini-2.5-flash"
    candidates: 20                    # Top N from RRF sent to reranker
    min_score: 0.0                    # Drop results when top rerank score is below this AND the query is degraded — set to e.g. 0.3 to filter off-corpus queries
  strategies:
    vector:
      weight: 0.5
      ef_search: 40                   # HNSW search-time exploration; higher = better recall, slower queries
    fulltext:
      weight: 0.3
    graph:
      weight: 0.2
      max_hops: 2                     # Recursive CTE depth limit
      supernode_threshold: 100        # Skip entities with more source mentions than this

# --- Similar Case Discovery ---
similar_case_discovery:
  enabled: true
  max_results: 10
  candidate_retrieval:
    vector_top_k: 100                 # Bounded broad candidate set
    geo_radius_km: null               # null = no geo filter at retrieval
    temporal_window_years: null       # null = no temporal filter at retrieval
  scoring:
    core_dimensions: ["semantic", "structural", "geospatial", "temporal"]
    weights:
      semantic: 0.25
      structural: 0.20
      geospatial: 0.15
      temporal: 0.10
    domain_dimensions: []             # Add generic ontology attribute comparisons here
  explanation:
    enabled: true
    engine: "deterministic"           # No paid LLM calls in M12-N1
    max_tokens: 200
  auto_discovery:
    enabled: true
    trigger: "on_ingest"
    threshold: 0.60
    create_graph_edge: true
    edge_type: "SIMILAR_TO"
    max_auto_links: 10

# --- Web Grounding (v2.0) ---
grounding:
  enabled: false                      # Enable for v2.0
  mode: "on_demand"                   # pipeline | on_demand | disabled
  enrich_types: ["location", "person", "organization"]
  cache_ttl_days: 30
  min_confidence: 0.7                 # Reject weakly supported grounding results
  exclude_domains: []                 # Optional low-quality domains to exclude from grounding

# --- Translation ---
translation:
  enabled: true
  default_target_language: "en"
  supported_languages: ["de", "en", "fr", "es", "pt", "ru", "zh", "ja", "pl", "cs"]
  engine: "gemini-2.5-flash"
  output_format: "markdown"           # markdown | html
  cache_enabled: true
  max_document_length_tokens: 500000

# --- Analysis (v2.0) ---
analysis:
  enabled: false                      # Enable for v2.0
  contradictions: true
  reliability: true
  evidence_chains: true
  evidence_theses:
    - "Acme activity in Berlin"
    - "Factory output in Munich"
  spatio_temporal: true
  cluster_window_days: 30

# --- Temporal Pattern Detection (internal weak signals) ---
temporal_pattern_detection:
  enabled: true
  schedule: "weekly"                  # Metadata only; no scheduler side effects in N3
  anomaly_detection:
    enabled: true
    min_entities: 5
    significance_threshold: 0.05
    baseline_window_years: 10
    granularity: "month"              # day | week | month | year
    region_grid: "country"            # country | admin1 | hex_grid_100km
    max_regions: 250
    max_windows: 120
    window_size_buckets: 1
    known_patterns: []                # Optional generic pattern refs for annotation only
    changepoint_detection:
      enabled: true
      threshold: 5
      drift_allowance: 0.5
      min_consecutive_windows: 2
  hotspot_clustering:
    enabled: true
    algorithm: "dbscan"               # HDBSCAN is deferred; M12 implements deterministic DBSCAN
    min_cluster_size: 3
    radius_km: 100
    temporal_granularity: "year"
    persistence_threshold_years: 5
    max_clusters: 100
  external_correlation:
    enabled: true
    series: []                        # Configure plugin_id/source_id/series_id entries for local deterministic plugins
    methods: ["spearman", "cross_correlation"]
    min_data_points: 30
    max_lag_days: 90
    always_include_caveat: true
  reporting_bias:
    correction_enabled: true
    correction_field: null            # Configure an ontology attribute such as observation intensity
    elevated_threshold: 1.5

# --- Sparse Graph Thresholds ---
# Features degrade gracefully below these thresholds.
# API responses include a confidence object with corpus_size and feature status.
thresholds:
  taxonomy_bootstrap: 25              # Documents before taxonomy bootstrap runs
  corroboration_meaningful: 50        # Documents before corroboration scores are reliable
  graph_community_detection: 100      # Entities before community detection is meaningful
  temporal_clustering: 30             # Events with timestamps before clustering activates
  source_reliability: 50              # Graph-connected sources before PageRank stabilizes

# --- Pipeline Concurrency & Retry ---
pipeline:
  concurrency:
    document_ai: 5                    # Max parallel Document AI batch requests
    gemini: 10                        # Max parallel Gemini calls
    embeddings: 20                    # Max parallel embedding batches
    grounding: 3                      # Max parallel Search Grounding calls (conservative)
  batch_size:
    extract: 10                       # Documents per Cloud Run Job task
    segment: 5                        # Documents per task (Gemini-intensive)
    embed: 50                         # Segments per embedding batch call
  retry:
    max_attempts: 3
    backoff_base_ms: 1000
    backoff_max_ms: 30000
  error_handling:
    partial_results: true             # Preserve partial results (95/100 pages OK = keep 95)
    continue_on_page_error: true      # Single page errors don't abort the whole document

# --- Vertex AI ---
vertex:
  max_concurrent_requests: 2             # Per-worker process Vertex AI concurrency limit (1-20)

# --- Cost Safety ---
safety:
  max_pages_without_confirm: 500      # Over 500 pages: CLI asks for confirmation
  max_cost_without_confirm_usd: 20    # Over $20 estimated: CLI asks for confirmation
  budget_alert_monthly_usd: 100       # GCP budget alert threshold
  block_production_calls_in_test: true # NODE_ENV=test: GCP calls blocked, fixtures forced

# --- Phase 2 (reserved, not yet implemented) ---

visual_intelligence:
  enabled: false
  extract_images: true
  analyze_images: true
  image_embedding: true
  extract_from_maps: true
  extract_from_diagrams: true

pattern_discovery:
  enabled: false
  run_after_batch: true
  anomaly_detection: true
  temporal_spikes: true
  subgraph_similarity: true
  digest:
    enabled: false
    frequency: "weekly"
